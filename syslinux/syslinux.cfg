UI vesamenu.c32
MENU TITLE Bison Linux
MENU BACKGROUND splash.png
MENU VSHIFT 4
TIMEOUT 150
DEFAULT bison
MENU COLOR screen       0  #ffffffff #00000000 std
MENU COLOR border       0  #ffffffff #00000000 std
MENU COLOR title        1;36;40 #ffffffff #00000000 std
MENU COLOR unsel        37;40 #ffffffff #00000000 std
MENU COLOR hotkey       1;37;40 #ffffffff #00000000 std
MENU COLOR sel           7;37;40 #ff000000 #ffffffff all
MENU COLOR hotsel       1;7;37;40 #ff000000 #ffffffff all
MENU COLOR scrollbar    0  #ffffffff #00000000 std
MENU COLOR help         37;40 #ffffffff #00000000 std
MENU COLOR msg          0  #ffffffff #00000000 std
LABEL bison
  MENU LABEL Bison install medium (x86_64, BIOS)
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
  APPEND archisobasedir=arch img_loop=/arch/x86_64/airootfs.sfs archisolabel=BISON_202611 earlymodules=loop

#LABEL bison_speech
#  MENU LABEL Bison install medium (x86_64, BIOS) with speech
#  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
#  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
#  APPEND archisobasedir=arch img_loop=/arch/x86_64/airootfs.sfs archisolabel=BISON_202611\ 
#  earlymodules earlymodules=loop accessibility=on

LABEL existing
  MENU LABEL Boot existing OS
  COM32 chain.c32
  APPEND hd0 0

LABEL memtest
  MENU LABEL Run Memtest86+ (RAM test)
  LINUX /%INSTALL_DIR%/boot/memtest

LABEL hdt
  MENU LABEL Hardware Information (HDT)
  COM32 hdt.c32

LABEL reboot
  MENU LABEL Reboot
  COM32 reboot.c32

LABEL poweroff
  MENU LABEL Power Off
  COM32 poweroff.c32