# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# buscar la ISO y setear root
search --no-floppy --set=root --file /arch/boot/x86_64/vmlinuz-linux
#set prefix="(${root})/boot/grub"

# graphics-mode + fondo compatible BIOS y UEFI
insmod all_video
if [ "${grub_platform}" == 'efi' ]; then
    insmod efi_gop
fi

insmod png
insmod font
insmod gettext
insmod gfxterm

if ! loadfont "${prefix}/fonts/unicode.pf2"; then
    loadfont "/boot/grub/fonts/unicode.pf2"
fi

set gfxmode=1280x720x32,1920x1080x32,1024x768x32,800x600x32,auto
terminal_output gfxterm
set gfxpayload=keep
#set theme="(${root})/boot/grub/themes/bison/theme.txt"
background_image "(${root})/boot/grub/themes/bison/splash.png"

set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Get the lowercase UEFI machine type short-name to use for architecture-specific tools
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == 'arm64' ]; then
        uefi_machine_type_lower='aa64'
    elif [ "${grub_cpu}" == 'riscv64' ]; then
        uefi_machine_type_lower='riscv64'
    elif [ "${grub_cpu}" == 'loongarch64' ]; then
        uefi_machine_type_lower='loongarch64'
    fi
fi

# Set default menu entry
default=bison
timeout=15
timeout_style=menu

# Menu entries
menuentry "Bison Linux install medium (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'bison' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Bison Linux install medium with speakup screen reader (%ARCH%, ${archiso_platform})" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a -f "/boot/memtest86+/memtest86${uefi_machine_type_lower}.efi" ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest86${uefi_machine_type_lower}.efi
    }
elif [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ -f "/shell${uefi_machine_type_lower}.efi" ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shell${uefi_machine_type_lower}.efi
        }
    fi
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}

# GRUB init tune for accessibility
play 600 988 1 1319 4